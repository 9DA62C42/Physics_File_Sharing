name: 📄 File request
description: Ask other students for notes, solutions or other files you are looking for.
title: "[Request] "
labels: ["file-request"]
body:
  - type: markdown
    attributes:
      value: |
        Open requests are listed on the website under **File requests**.
        If you have the file someone asked for, upload it and mention this issue number in your commit message or pull request.
  - type: dropdown
    id: subject
    attributes:
      label: Subject
      options:
        - Waves
        - Complex Functions
        - Something else (say which below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What are you looking for?
      placeholder: e.g. Worked solutions for homework 3, or a formula sheet for the midterm
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Course or textbook (optional)
      placeholder: e.g. 01140086 Waves
