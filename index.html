<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics File Sharing</title>
  <meta name="description" content="Notes, problem sets, formula sheets and lab reports shared by physics students.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem("pfs:theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">⚛</span>
        <span class="brand-name" id="brand-name">Physics File Sharing</span>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="nav-link" type="button"></button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>

    <div class="content">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Search files, courses, IDs, people…" autocomplete="off" aria-label="Search files">
          <kbd>/</kbd>
        </label>
        <a id="upload-btn" class="btn primary" target="_blank" rel="noopener">Upload</a>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="footer">
        <p>Built by students with GitHub Pages · Share only your own work or freely licensed material.</p>
      </footer>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
