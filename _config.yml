# Site settings for GitHub Pages (Jekyll).
# Most people never need to edit this file.

title: Physics File Sharing
description: Notes, problem sets, formula sheets and lab reports shared by physics students.

# Used for the "Upload a file" button when the site is built outside GitHub Pages.
# On GitHub Pages the repository is detected automatically.
repository_url: https://github.com/9da62c42/physics_file_sharing
branch: main

# Keep repository docs out of the published site.
exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
