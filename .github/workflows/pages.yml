name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for upload dates and contributors

      - name: Load verifications
        # Written by the Verify files workflow to its own branch; empty until the first verification.
        run: |
          if git fetch --depth 1 origin verifications; then
            git show FETCH_HEAD:verifications.json > verifications.json
          else
            echo '{"records": []}' > verifications.json
          fi

      - name: Build file index
        run: python3 scripts/build_index.py
        env:
          GITHUB_TOKEN: ${{ github.token }} # to look up uploaders' GitHub usernames

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets files files.json uploaders.json courses.json licenses.json uploads.json verifications.json _site/
          # Give the CSS and JS a new address on every deploy, so browsers don't keep using old copies.
          sed -i -E "s#(assets/(css|js)/[a-z]+\.(css|js))\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
