name: Verify files

# Owner and collaborators verify files by opening an issue labelled "verify" or
# "unverify" (the website's Verify and Unverify buttons pre-fill it, label included).
# Only people with triage access or more can set labels on a new issue. This records the verification in
# verifications.json on the "verifications" branch, redeploys the site, and replies
# on the issue. The records live on their own branch so that rules protecting main
# (for example "require a pull request") don't block this workflow.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    if: contains(github.event.issue.labels.*.name, 'verify') || contains(github.event.issue.labels.*.name, 'unverify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load existing records
        run: |
          if git fetch --depth 1 origin verifications; then
            git show FETCH_HEAD:verifications.json > verifications.json
          fi

      - name: Check permission and record
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: python3 scripts/verify.py

      - name: Commit and redeploy
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv verifications.json "$RUNNER_TEMP/verifications.json"
          if git ls-remote --exit-code --heads origin verifications > /dev/null; then
            git fetch --depth 1 origin verifications
            git switch -c verifications FETCH_HEAD
          else
            git switch --orphan verifications
          fi
          cp "$RUNNER_TEMP/verifications.json" verifications.json
          git add verifications.json
          git commit -m "Update verifications (issue #${ISSUE_NUMBER})"
          git push origin verifications
          # Pushes made with the workflow token don't start other workflows, so deploy explicitly.
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          [ -f "$REPLY_FILE" ] || echo "Something went wrong while recording this verification. Please check the workflow run." > "$REPLY_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
