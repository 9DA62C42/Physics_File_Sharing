name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for upload dates and contributors

      - name: Build file index
        run: python3 scripts/build_index.py
        env:
          GITHUB_TOKEN: ${{ github.token }} # to look up uploaders' GitHub usernames

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets files files.json uploaders.json courses.json licenses.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
