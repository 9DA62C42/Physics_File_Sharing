name: 📤 Upload a file
description: Share notes, solutions or other files. No Git needed; a maintainer reviews it before it goes on the website.
title: "[Upload] "
labels: ["upload"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the form and drag your file into the box below. A bot checks it and opens a pull request; a maintainer reviews it, and once it's merged the file appears on the website.

        **Everything here is public.** Share only your own work or material you have permission to share, and remove personal information first.

        **Copyright:** don't upload textbooks, solution manuals, official exams, homework sheets or lecture slides without the owner's permission, or solutions to assignments that are still open. Uploads that break this are refused or removed.
  - type: textarea
    id: files
    attributes:
      label: Files
      description: |
        Drag the files into this box and wait until each one shows as a link. PDF is best. Put LaTeX or other source files in one **.zip** (GitHub doesn't accept .tex attachments). Up to 25 MB per file.
    validations:
      required: true
  - type: input
    id: file_title
    attributes:
      label: Title
      description: A readable title. Letters, numbers, spaces and . , - ( ) & only.
      placeholder: e.g. Waves Homework 1 Solution
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject
      description: The subject on the website, e.g. Waves. A name that doesn't exist yet creates a new subject.
      placeholder: e.g. Waves
    validations:
      required: true
  - type: input
    id: kind
    attributes:
      label: Kind of material
      description: "The type code, e.g. LN (lecture note), HWS (homework solution), PES (past exam solution), TN (tutorial note). All codes: https://9da62c42.github.io/Physics_File_Sharing/#/ids?tab=rules"
      placeholder: e.g. LN
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Licence
      description: "How others may use the file, as a code: ARR (all rights reserved; choose this if unsure), STUDY, CCBY, CCBYNC, CCBYSA, CCBYNCSA, CCBYND, CCBYNCND, CC0, PD, MIT, GPL3. Only the author can choose an open licence. What they mean: https://9da62c42.github.io/Physics_File_Sharing/#/help"
      placeholder: e.g. ARR
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### File ID (recommended)
        Fill in all four boxes to give the file an ID such as `01140086_HWS_2627W_01_123456789`. Leave them all empty to upload without one. The website's **ID system → Build a name** page explains each part.
  - type: input
    id: course
    attributes:
      label: Course code
      description: 8 digits.
      placeholder: e.g. 01140086
  - type: input
    id: course_name
    attributes:
      label: Course name
      description: Only needed if the course isn't on the website yet, so it shows as "01140086 · Waves".
      placeholder: e.g. Linear Algebra 1 (leave empty for a known course)
  - type: input
    id: term
    attributes:
      label: Term
      description: e.g. 2627W (Winter 2026–27), 2526S (Spring 2026), LEGACY or Undated.
      placeholder: e.g. 2627W
  - type: input
    id: item
    attributes:
      label: Item
      description: "e.g. 01, 01b, A, Q01, PS01, C01 or FULL. You can add a version (any numbering: V1, V02, V4.1) or tags after it, e.g. FULL_V4.1 or 01_AN."
      placeholder: e.g. 01
  - type: input
    id: student
    attributes:
      label: Student number
      description: Your 9-digit student number. It is public and credits the file to you.
      placeholder: e.g. 123456789
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I wrote this file, or I have permission to share it under the licence above.
          required: true
        - label: It contains no personal information (phone numbers, grades, ...) and isn't a solution to an open assignment.
          required: true
