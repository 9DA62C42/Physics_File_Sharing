name: 🆔 Register your student number
description: Show your name on files that carry your student number (optional).
title: "[Register] "
labels: ["uploader-code"]
body:
  - type: markdown
    attributes:
      value: |
        Your student number goes at the end of a file's ID, e.g. `01140086_HWS_2627W_01_123456789 Waves Homework 1 Solution.pdf`.
        It already works without registering; registering just shows your name instead of "Student 123456789".

        **This issue is public, and so is your student number on the website.**
  - type: input
    id: number
    attributes:
      label: Student number
      description: 9 digits.
      placeholder: "123456789"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name to show on the website
      placeholder: Alice Wang
    validations:
      required: true
  - type: dropdown
    id: github
    attributes:
      label: Link this GitHub account to confirm your uploads?
      description: Optional. If yes, files you upload from the account that opens this issue are shown as confirmed.
      options:
        - "No"
        - "Yes, link the account opening this issue"
    validations:
      required: true
